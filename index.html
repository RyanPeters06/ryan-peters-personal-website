<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='11' fill='%238fce7f'/%3E%3Cellipse cx='11' cy='9' rx='5' ry='2.6' fill='%23ffffff'/%3E%3Cellipse cx='23' cy='12' rx='4' ry='2.2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <!-- viewport-fit=cover lets the sky reach the screen edges instead of
         being letterboxed beside the notch. It also makes every
         env(safe-area-inset-*) resolve to a real value — without it they
         are all 0px and the overlay's inset handling is a no-op. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ryan Land — a tiny living world that happens to be the software engineering portfolio of Ryan Peters."
    />
    <title>Ryan Land</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
